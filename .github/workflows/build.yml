name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        run: |
          echo "Files in repo:"; find . -path ./.git -prune -o -type f -print | head -80
          GRADLE=$(find . -name build.gradle -not -path './.git/*' | head -n1)
          if [ -z "$GRADLE" ]; then
            ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -n1)
            if [ -z "$ZIP" ]; then echo "No zip and no build.gradle found"; exit 1; fi
            echo "Using zip: $ZIP"
            unzip -q "$ZIP" -d /tmp/_src
            GRADLE=$(find /tmp/_src -name build.gradle | head -n1)
            if [ -z "$GRADLE" ]; then echo "Zip has no build.gradle"; exit 1; fi
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        run: gradle build
        working-directory: ${{ env.PROJECT_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: yandere_mod-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
