name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzip if needed)
        run: |
          if [ -f build.gradle ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n1)
            if [ -z "$ZIP" ]; then echo "No zip and no build.gradle found"; exit 1; fi
            unzip -q "$ZIP" -d _src
            DIR=$(dirname "$(find _src -name build.gradle | head -n1)")
            echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        run: gradle build
        working-directory: ${{ env.PROJECT_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: yandere_mod-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
